name: ci
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 9 * * 1"   # weekly re-validation report (Mondays)
permissions:
  contents: read
jobs:
  check:
    name: records (schema + changed-source probes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "httpx==0.28.1" "duckdb==1.5.4" "pytest==9.1.1"
      - name: schema check (every record + every answers/ file; no live fetch)
        run: python -m sourcetool check
      - name: lints (kinds served minus reasoned exemptions, utc consistency, keyword baseline ratchet; offline)
        run: python -m sourcetool answers-check --lint
      - name: probe sources changed in this PR (fail on regressions only)
        if: github.event_name == 'pull_request'
        run: |
          git diff --unified=0 origin/${{ github.base_ref }}...HEAD -- 'sources/**/*.jsonl' \
            | grep '^+{' | cut -c2- > changed.jsonl || true
          git diff --unified=0 origin/${{ github.base_ref }}...HEAD -- 'sources/**/*.jsonl' \
            | grep '^-{' | cut -c2- > before.jsonl || true
          echo "$(wc -l < changed.jsonl) changed records"
          python - <<'PY'
          import json, pathlib, subprocess, sys
          changed = [json.loads(l) for l in pathlib.Path("changed.jsonl").read_text().splitlines() if l.strip()]
          prev = {r["id"]: r for r in map(json.loads, pathlib.Path("before.jsonl").read_text().splitlines()) if r}
          def addr(r):  # what decides whether the source works: its address, params, headers, format
              a = r.get("access", {})
              params = [(p.get("name"), p.get("example")) for p in a.get("params", [])]  # not fills/metadata
              return json.dumps([a.get("kind"), a.get("url_template"), params, a.get("headers")], sort_keys=True)
          # probe only new sources and sources whose address changed; a metadata-only edit is not a
          # reason to re-probe (third parties often block GitHub's datacenter IPs; the operator's
          # scheduled validation from a residential connection is the source of truth for status)
          ids = [r["id"] for r in changed if r["id"] not in prev or addr(r) != addr(prev[r["id"]])][:300]
          if ids:
              subprocess.run([sys.executable, "-m", "sourcetool", "validate", "--id", ",".join(ids)], check=True)
          now = {r["id"]: r.get("validation", {}).get("status")
                 for f in pathlib.Path("sources").rglob("*.jsonl") for r in map(json.loads, f.read_text().splitlines())
                 if r["id"] in set(ids)}
          bad = [i for i in ids if now.get(i) == "failed"]
          print(f"{len(changed)} changed, {len(ids)} with a new or changed address probed | failing: {bad}")
          sys.exit(1 if bad else 0)
          PY
      - name: resolver accuracy (development + held-out sets must stay at 100%)
        run: python -m sourcetool evalres resolution_asks resolution_holdout
      - name: build the DuckDB index
        run: python -m sourcetool build
      - name: offline suite (answers rules, recorded samples, asks overlap gate, taxonomy recall, resolvers, tooling; the built pack's tests included)
        run: python -m pytest tests -q --ignore=tests/test_ingest.py
      - name: "source lookup, development set (the first source offered must be right; rows no offerable source can serve are reported, not counted)"
        run: python -m sourcetool evallookup lookup_asks
      - name: "source lookup, held-out + sealed (measured, never tuned on; held-out stood at 36/38 on 2026-10-06)"
        run: python -m sourcetool evallookup lookup_holdout lookup_sealed || echo "::warning::held-out or sealed lookup below 100%, see output"
  service:
    name: Library API + ingest tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r service/requirements-test.txt
      - run: python -m pytest service/tests tests/test_ingest.py -q
  revalidate:
    name: weekly re-validation + answers re-check
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # pushes the rechecked answers files to a recheck/<date> branch; the PR is opened by hand
    steps:
      - uses: actions/checkout@v4
      - name: the app's parsers (csv / feed / xml / text samples are parsed exactly as its cards parse them)
        uses: actions/checkout@v4
        with:
          repository: SecureCloudGroup/SmartBrain_3000
          path: .app
          sparse-checkout: app/smartbrain_3000
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "httpx==0.28.1" "duckdb==1.5.4" cryptography
      - name: re-validate curated records (report only)
        run: python -m sourcetool validate --only curated || true
      - name: re-check every answers file against a fresh live sample
        id: recheck
        env:
          SMARTBRAIN_APP: ${{ github.workspace }}/.app/app
        run: |
          set +e
          python -m sourcetool answers-recheck | tee recheck.log
          echo "rc=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
      - name: push the changed answers files for a PR
        if: always()
        run: |
          rm -rf .app
          git add -A answers sources
          if git diff --cached --quiet; then echo "nothing changed"; exit 0; fi
          BR="recheck/$(date -u +%F)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "answers-recheck $(date -u +%F): $(tail -1 recheck.log)"
          git push -f origin "HEAD:refs/heads/$BR"
          { echo "## answers-recheck"; echo; echo '```'; cat recheck.log; echo '```'; echo;
            echo "Branch \`$BR\` pushed — open the PR: https://github.com/${GITHUB_REPOSITORY}/compare/main...$BR"; } >> "$GITHUB_STEP_SUMMARY"
      - name: fail the run when any file failed or drifted
        if: steps.recheck.outputs.rc != '0'
        run: exit 1
